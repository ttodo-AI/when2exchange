<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Dashboard</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --muted:#8b93a7; --fg:#e6e9f0;
          --line:#2a2f3a; --accent:#6ea8fe; --good:#3fb950; --mid:#d29922; --low:#6e7681; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif; }
  header { padding:24px 20px 12px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:20px; }
  .meta { color:var(--muted); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center;
              padding:14px 20px; position:sticky; top:0; background:var(--bg);
              border-bottom:1px solid var(--line); z-index:5; }
  .controls input, .controls select { background:var(--card); color:var(--fg);
              border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; }
  #q { flex:1; min-width:180px; }
  .controls label { color:var(--muted); font-size:13px; }
  #count { color:var(--muted); font-size:13px; margin-left:auto; }
  main { padding:18px 20px 60px; display:grid; gap:16px;
         grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .badge { font-size:12px; padding:3px 8px; border-radius:999px; border:1px solid var(--line);
           color:var(--fg); white-space:nowrap; }
  .badge.total { font-weight:700; }
  .b-good { background:rgba(63,185,80,.15); border-color:var(--good); }
  .b-mid  { background:rgba(210,153,34,.15); border-color:var(--mid); }
  .b-low  { background:rgba(110,118,129,.15); border-color:var(--low); }
  .title { font-size:15px; font-weight:600; margin:2px 0 6px; line-height:1.4; }
  a.src { color:var(--accent); font-size:13px; text-decoration:none; }
  a.src:hover { text-decoration:underline; }
  .section { margin-top:12px; }
  .section h4 { margin:0 0 6px; font-size:12px; letter-spacing:.04em;
                text-transform:uppercase; color:var(--muted); }
  .kv { font-size:13.5px; line-height:1.5; margin:2px 0; }
  .kv b { color:var(--muted); font-weight:600; }
  .reason { color:var(--muted); font-size:12.5px; }
  .draft { white-space:pre-wrap; background:#11141a; border:1px solid var(--line);
           border-radius:8px; padding:12px; font-size:13.5px; line-height:1.6; margin-top:6px; }
  .copy { margin-top:8px; background:var(--accent); color:#06122b; border:none;
          border-radius:8px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .copy.done { background:var(--good); color:#03210c; }
  .empty { color:var(--muted); padding:40px 20px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Content Dashboard</h1>
  <div class="meta">Source: drafts-2026-06-04_2244.json &middot; Generated 2026-06-04 22:44 UTC &middot; 3 items</div>
</header>
<div class="controls">
  <input id="q" type="search" placeholder="Filter by text (title / brief / draft)…">
  <label>Min total <input id="min" type="number" min="0" max="20" value="0" style="width:64px"></label>
  <label>Sort
    <select id="sort">
      <option value="total">Total score</option>
      <option value="relevance">Relevance</option>
      <option value="content_potential">Content potential</option>
      <option value="title">Title</option>
    </select>
  </label>
  <label><input id="dir" type="checkbox" checked> Desc</label>
  <span id="count"></span>
</div>
<main id="grid"></main>
<script>
const DATA = [{"title": "원·달러 환율 1530원 돌파…외환당국 구두개입에 턱밑 마감", "link": "https://www.pointe.co.kr/news/articleView.html?idxno=80267", "total": 17, "relevance": 9, "relevance_reason": "원·달러 환율의 주요 변동 뉴스로 실시간 환전 의사결정에 직접 영향", "content_potential": 8, "content_reason": "지정학적 배경+정부 개입 등 맥락 제공으로 환율 이해도 증진, 공유 가치 높음", "hook": "환율이 또 터졌다, 1530원 돌파…당신의 지갑은 안전한가?", "point": "원달러 환율이 1530원을 넘으면서 수입품 가격 상승과 해외송금 비용 증가가 임박했다. 정부의 구두개입에도 환율 상승을 막지 못한 상황을 이해하고 개인의 환전 전략을 미리 세워야 한다.", "example": "환율이 1480원에서 1530원으로 올라가면, 100달러 환전할 때 5000원의 손실 발생 (3개월 전 기준)", "format": "카루셀 (4-5장): 1) 현재 환율 상황 2) 왜 올랐는지 3) 당신에게 미치는 영향 4) 개인이 할 수 있는 3가지 대응 방법", "post": "환율이 또 터졌습니다. 1530원 돌파… 당신의 지갑은 안전한가요? 💸\n\n원달러 환율이 1530원을 넘어섰어요.\n정부가 구두개입까지 했지만, 막지 못했습니다.\n\n이게 나랑 무슨 상관이냐고요?\n\n3개월 전 환율이 1480원이었을 때\n100달러 환전하면 148,000원이었어요.\n지금은 153,000원.\n같은 돈인데 5,000원이 더 나갑니다.\n\n해외직구 자주 하시나요?\n달러로 송금할 일 있으신가요?\n그렇다면 지금 바로 체감하실 거예요.\n\n개인이 할 수 있는 대응은 세 가지입니다.\n\n첫째, 수입품이나 해외직구 계획이 있다면 최대한 앞당기세요.\n둘째, 달러 환전은 소액으로 분산해서 하세요. 한 번에 몰빵은 금물.\n셋째, 환율 알림 설정해두고 1500원 아래로 내려올 때를 노리세요.\n\n환율은 우리가 통제할 수 없지만,\n대응 타이밍은 내가 정할 수 있습니다. 😊\n\n#환율 #원달러환율 #재테크 #환전전략 #개인금융"}, {"title": "원·달러 환율, 개장 후 1530원 돌파… 3월 31일 이후 처음 - 조선비즈", "link": "https://biz.chosun.com/policy/policy_sub/2026/06/04/NAMI6MU53FBSFAVDZ2BERS3RIY/", "total": 16, "relevance": 9, "relevance_reason": "직접적인 원·달러 환율 뉴스로 환전·해외송금 계획 중인 20-30대 재무 관심층의 핵심 관심사", "content_potential": 7, "content_reason": "시의성 있는 환율 급등 정보지만 분석 깊이 부족해 단순 정보 전달 수준", "hook": "3월 이후 처음이라고? 1530원 터진 지금이 환전 타이밍일까", "point": "원달러 환율이 3월 31일 이후 처음으로 1530원을 돌파했다는 시간적 맥락을 알면, 현재가 얼마나 심각한 상황인지 체감할 수 있다.", "example": "3월 환율(약 1470원)과 지금(1530원)의 60원 차이 = 달러 자산 100만 원 보유 시 6만 원 손해", "format": "릴스 (15초): 환율 그래프 애니메이션 + 숫자 강조 + 명확한 액션 CTA ('지금 환전할까?')", "post": "3월 이후 처음이라고요? 1530원이 또 터졌습니다 📈\n\n오늘 원달러 환율이 1530원을 돌파했어요.\n3월 31일 이후 처음입니다.\n\n숫자로 보면 이렇습니다.\n\n3월 환율 약 1470원.\n지금 환율 약 1530원.\n차이는 60원.\n\n달러 자산을 100만 원어치 갖고 계신 분이라면\n그냥 6만 원이 증발한 거예요.\n아무것도 안 했는데요.\n\n그럼 지금 환전해야 할까요?\n\n솔직히 정답은 없어요.\n하지만 환율이 더 오를 가능성이 있다면,\n달러가 꼭 필요한 분들은 지금 분산 매수하는 게 낫습니다.\n\n반대로 원화가 필요한 분이라면\n달러 매도 타이밍으로 나쁘지 않고요.\n\n방향을 모르겠다면 일단 '지금 내 환전 계획이 있는지' 먼저 점검해보세요. ✅\n\n#환율 #원달러환율 #1530원 #환전타이밍 #재테크"}, {"title": "정부 입김 안 통하네… 원·달러 환율, 개장 후 1530원 돌파", "link": "http://www.pressna.com/news/newsview.php?ncode=1381200691444795", "total": 16, "relevance": 9, "relevance_reason": "원·달러 환율 최신 변동으로 환전 타이밍을 고민하는 독자층에게 직결", "content_potential": 7, "content_reason": "정부 대응 실패라는 드라마틱한 각도 있으나 실질적 조언 부족", "hook": "정부도 못 막았다, 환율 폭주기 당신은 뭘 할 건가?", "point": "정부의 구두개입 실패로 환율 상승이 불가피하다는 신호이므로, 수입품 구매나 달러 환전 계획이 있다면 지금 서둘러야 한다.", "example": "구두개입에도 불구하고 1530원 돌파 = 정부 여력 한계, 추가 상승 가능성 높음", "format": "블로그 포스트 (800-1000자): 환율 상황 분석 + 개인 금융 전략 3가지 (수입품 구매 타이밍, 환전 전략, 달러 자산 배분) + 읽기 쉬운 텍스트와 간단한 도표", "post": "정부도 못 막았습니다. 환율 1530원 돌파입니다 🚨\n\n오늘 외환당국이 구두개입을 했어요.\n그런데 환율은 그냥 뚫렸습니다.\n\n구두개입이란 건 쉽게 말해서\n'정부가 말로 경고하는 것'이에요.\n실제 달러를 풀기 전 마지막 카드 중 하나죠.\n\n그게 안 통했다는 건,\n시장이 그만큼 강하게 달러를 원하고 있다는 뜻입니다.\n\n그렇다면 개인은 어떻게 해야 할까요?\n\n첫째, 수입품 구매 계획 있으면 서두르세요.\n환율이 더 오르면 가격도 따라 오릅니다.\n\n둘째, 달러 환전은 한 번에 하지 말고 나눠서 하세요.\n지금 1530원이 고점인지 아무도 모르니까요.\n\n셋째, 달러 자산 비중을 점검해보세요.\n환율이 높을 때는 달러 자산이 방어막이 될 수 있습니다.\n\n정부 여력엔 한계가 있을 수 있어요.\n내 돈은 내가 지켜야 합니다. 💪\n\n#환율 #원달러환율 #환전전략 #달러 #개인금융 #재테크"}];
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const minEl = document.getElementById('min');
const sortEl = document.getElementById('sort');
const dirEl = document.getElementById('dir');
const countEl = document.getElementById('count');

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function band(v,max){ if(v==null) return 'b-low'; const r=v/max;
  return r>=0.8?'b-good':r>=0.6?'b-mid':'b-low'; }

function render(){
  const term = q.value.trim().toLowerCase();
  const min = Number(minEl.value)||0;
  const key = sortEl.value;
  const desc = dirEl.checked;
  let rows = DATA.filter(d => (d.total==null?0:d.total) >= min);
  if(term){
    rows = rows.filter(d => [d.title,d.hook,d.point,d.example,d.format,d.post]
      .some(x => (x||'').toLowerCase().includes(term)));
  }
  rows.sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(key==='title'){ av=(av||'').toLowerCase(); bv=(bv||'').toLowerCase();
      return desc ? bv.localeCompare(av) : av.localeCompare(bv); }
    av=av==null?-1:av; bv=bv==null?-1:bv;
    return desc ? bv-av : av-bv;
  });
  countEl.textContent = rows.length + ' shown';
  if(!rows.length){ grid.innerHTML = '<div class="empty">No items match.</div>'; return; }
  grid.innerHTML = rows.map(d => `
    <div class="card">
      <div class="badges">
        <span class="badge total ${band(d.total,20)}">Total ${d.total==null?'?':d.total}/20</span>
        <span class="badge ${band(d.relevance,10)}">Relevance ${d.relevance==null?'?':d.relevance}/10</span>
        <span class="badge ${band(d.content_potential,10)}">Content ${d.content_potential==null?'?':d.content_potential}/10</span>
      </div>
      <div class="title">${esc(d.title)}</div>
      ${d.link?`<a class="src" href="${esc(d.link)}" target="_blank" rel="noopener">원문 보기 ↗</a>`:''}
      ${(d.relevance_reason||d.content_reason)?`<div class="section">
        ${d.relevance_reason?`<div class="reason">· 관련성: ${esc(d.relevance_reason)}</div>`:''}
        ${d.content_reason?`<div class="reason">· 콘텐츠: ${esc(d.content_reason)}</div>`:''}
      </div>`:''}
      <div class="section">
        <h4>Brief</h4>
        ${d.hook?`<div class="kv"><b>Hook</b> · ${esc(d.hook)}</div>`:''}
        ${d.point?`<div class="kv"><b>Point</b> · ${esc(d.point)}</div>`:''}
        ${d.example?`<div class="kv"><b>Example</b> · ${esc(d.example)}</div>`:''}
        ${d.format?`<div class="kv"><b>Format</b> · ${esc(d.format)}</div>`:''}
      </div>
      <div class="section">
        <h4>Draft</h4>
        <div class="draft">${esc(d.post)}</div>
        <button class="copy" data-post="${esc(d.post)}">Copy draft</button>
      </div>
    </div>`).join('');
}

grid.addEventListener('click', e => {
  const btn = e.target.closest('.copy');
  if(!btn) return;
  const text = btn.getAttribute('data-post')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='Copied ✓'; btn.classList.add('done');
    setTimeout(()=>{ btn.textContent='Copy draft'; btn.classList.remove('done'); },1500);
  });
});
[q,minEl,sortEl,dirEl].forEach(el => el.addEventListener('input', render));
render();
</script>
</body>
</html>
