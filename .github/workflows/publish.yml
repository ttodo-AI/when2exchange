name: Build & publish share page

# 한국시간(KST=UTC+9) 기준 하루 2회. cron은 UTC.
on:
  schedule:
    - cron: '0 0 * * *'    # 09:00 KST -> full  (요인·일정까지 새로)
    - cron: '0 9 * * *'    # 18:00 KST -> light (환율·판정·왜·체감만)
  workflow_dispatch:        # 수동 실행
    inputs:
      mode:
        description: 'build mode'
        default: full
        type: choice
        options: [full, light]

permissions:
  contents: write   # site/·output/ 를 다시 커밋해 아카이브 누적
  pages: write
  id-token: write
  issues: write     # 실패 시 이슈로 알림(=멘션 메일)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Decide build mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=light" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        env:
          # 뉴스 검색은 Google News RSS(무료)로 이전됨 — Firecrawl 미사용.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python executions/build_site.py --mode ${{ steps.m.outputs.mode }}

      # 모트(해자): 오늘 신호를 track_record.jsonl에 1줄 append. 빌드(rate.json 갱신) 후,
      # 커밋 전에 실행돼야 새 줄이 함께 커밋된다. 이미 기록된 날이면 자동 스킵(2회/일 안전).
      - name: Log daily exchange signal (track record)
        run: python executions/track_record.py --today

      - name: Commit refreshed site & data (persist archive)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site output
          git commit -m "build(${{ steps.m.outputs.mode }}): $(date -u +%FT%TZ)" || echo "no changes"
          git push

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

      # 실패 알림 — full이 조용히 죽는 걸 막는다(2026-08~09: 크레딧 소진으로 20일 방치).
      # light는 API를 안 써서 계속 성공하므로 겉보기엔 정상이다 → 실패는 따로 알려야 한다.
      # 이슈를 열고 소유자를 멘션하면 GitHub이 멘션 알림 메일을 보낸다(SMTP·Secret 불필요).
      # 이미 열린 알림 이슈가 있으면 새로 만들지 않는다(매일 메일 폭탄 방지).
      - name: Notify on failure (open an issue -> mention email)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.m.outputs.mode }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$(gh issue list --label build-failure --state open --json number -q 'length')" != "0" ]; then
            echo '이미 열린 알림 이슈 있음 — 중복 생성 안 함.'
            exit 0
          fi
          gh label create build-failure --color B60205 --description '예약 빌드 실패' || true
          cat > /tmp/issue.md <<EOF
          @$OWNER 예약 빌드가 실패했개요.

          - 모드: **$MODE**
          - 로그: $RUN_URL

          가장 흔한 원인은 **Anthropic 크레딧 소진**이에요 (로그에서 'credit balance is too low' 검색).
          light 빌드는 API를 안 써서 계속 성공하니, 이 알림이 없으면 멈춘 걸 알아채기 어려워요.
          분석이 2일 이상 묵으면 페이지·미니앱은 해설을 숨기고 '요인 분석 갱신 대기'만 보여줘요
          (환율·게이지·차트는 정상 갱신).

          고친 뒤: 'gh workflow run publish.yml -f mode=full' 으로 즉시 복구하고 이 이슈를 닫으세요.
          EOF
          gh issue create --label build-failure --title "🔴 예약 빌드 실패 ($MODE) — $(date -u +%F)" --body-file /tmp/issue.md
