<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- background (full-bleed; IG는 원형 크롭) -->
  <rect width="1080" height="1080" fill="#FFF1DF"/>

  <!-- ears (pointy, 사이트 회색톤) -->
  <polygon points="360,205 305,398 472,360" fill="#8B94A0"
           stroke="#8B94A0" stroke-width="34" stroke-linejoin="round"/>
  <polygon points="720,205 775,398 608,360" fill="#8B94A0"
           stroke="#8B94A0" stroke-width="34" stroke-linejoin="round"/>
  <polygon points="378,278 346,372 444,350" fill="#7F8893"
           stroke="#7F8893" stroke-width="14" stroke-linejoin="round"/>
  <polygon points="702,278 734,372 636,350" fill="#7F8893"
           stroke="#7F8893" stroke-width="14" stroke-linejoin="round"/>

  <!-- head -->
  <rect x="298" y="300" width="484" height="452" rx="146" fill="#9AA3AD"/>

  <!-- beard / muzzle (슈나우저 시그니처 — 큰 회색 수염) -->
  <path d="M348 598 Q336 556 392 556 L688 556 Q744 556 732 598
           L718 718 Q694 792 540 798 Q386 792 362 718 Z" fill="#D3D8DE"/>

  <!-- eyebrows (시그니처 — 덥수룩한 눈썹) -->
  <ellipse cx="452" cy="482" rx="72" ry="34" fill="#D3D8DE" transform="rotate(-11 452 482)"/>
  <ellipse cx="628" cy="482" rx="72" ry="34" fill="#D3D8DE" transform="rotate(11 628 482)"/>

  <!-- eyes (눈썹 아래) -->
  <circle cx="455" cy="528" r="29" fill="#1C2230"/>
  <circle cx="625" cy="528" r="29" fill="#1C2230"/>
  <circle cx="466" cy="518" r="9" fill="#FFFFFF"/>
  <circle cx="636" cy="518" r="9" fill="#FFFFFF"/>

  <!-- nose (수염 위) -->
  <ellipse cx="540" cy="602" rx="44" ry="32" fill="#1C2230"/>

  <!-- mouth -->
  <path d="M540 634 Q540 664 512 670" stroke="#1C2230" stroke-width="11"
        fill="none" stroke-linecap="round"/>
  <path d="M540 634 Q540 664 568 670" stroke="#1C2230" stroke-width="11"
        fill="none" stroke-linecap="round"/>

  <!-- signal-light signature (브랜드 신호등) -->
  <circle cx="812" cy="858" r="20" fill="#15B86A"/>
  <circle cx="868" cy="858" r="20" fill="#FFB020"/>
  <circle cx="924" cy="858" r="20" fill="#F04452"/>
</svg>
